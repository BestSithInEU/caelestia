# ─── General ──────────────────────────────────────────────────────────────────
set-environment -g PATH "/sbin:/usr/sbin:/usr/local/bin:/usr/bin:/bin"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -ag terminal-features ",xterm-ghostty:hyperlinks"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -ag terminal-features ",xterm-kitty:hyperlinks"
set -g history-limit 50000
set -g mouse on
set -s escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g aggressive-resize on
set -g display-time 4000
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -s terminal-features 'xterm-ghostty:extkeys'

# Pass Shift+Enter through to applications (CSI u: \e[13;2u)
bind -n S-Enter send-keys Escape '[13;2u'

# ─── Claude ───────────────────────────────────────────────────────────────────
bind C-c display-popup -E -w 80% -h 80% "claude-tmux"
# Launch with C-Space, Ctrl-c

# ─── Prefix ───────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─── Reload config ────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ─── Quick command palette ────────────────────────────────────────────────────
bind P display-popup -E -w 50% -h 50% "printf 'kill-session\nkill-window\nkill-pane\nkill-server\nnew-window\nnew-session\nrename-window\nrename-session\nswap-window\nswap-pane\nresize-pane\nlist-keys\nshow-options\nclock-mode\nclear-history\nsource ~/.tmux.conf' | fzf --prompt='tmux> ' --reverse | xargs -I{} tmux {}"

# ─── Copy mode (vi keys) ──────────────────────────────────────────────────────
set-window-option -g mode-keys vi
unbind [
unbind ]
bind e copy-mode
bind p paste-buffer

# ─── Pane splitting (keep current path) ──────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ─── Pane navigation (Alt+Arrows) ───────────────────────────────────────────
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# ─── Pane resizing (prefix + Arrows, repeatable) ────────────────────────────
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

# ─── Kill pane/window ────────────────────────────────────────────────────────
bind x kill-pane
bind q kill-window

# ─── Window switching ───────────────────────────────────────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n S-Right next-window
bind -n S-Left  previous-window
bind -n C-S-Left  swap-window -t -1 \; previous-window
bind -n C-S-Right swap-window -t +1 \; next-window

# ─── Sesh (session manager with zoxide) ─────────────────────────────────────
bind f run-shell "sesh connect \"$(sesh list -i | fzf-tmux -p 55%,60% --no-sort --ansi --border-label ' sesh ' --prompt '  ' --header '  C-a all / C-t tmux / C-g config / C-x zoxide / C-d kill / C-f find' --bind 'tab:down,btab:up' --bind 'ctrl-a:change-prompt(  )+reload(sesh list -i)' --bind 'ctrl-t:change-prompt(  )+reload(sesh list -it)' --bind 'ctrl-g:change-prompt(  )+reload(sesh list -ic)' --bind 'ctrl-x:change-prompt(  )+reload(sesh list -iz)' --bind 'ctrl-f:change-prompt(  )+reload(fd -H -d 2 -t d -E .Trash . ~)' --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(  )+reload(sesh list -i)')\""

# ─── Plugin config (set BEFORE loading anything) ───────────────────────────
set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'
set -g @tilish-default 'main-vertical'
set -g @thumbs-command 'echo -n {} | wl-copy'
set -g @thumbs-upcase-command 'echo -n {} | wl-copy'
set -g @extrakto_clip_tool 'wl-copy'
set -g @extrakto_fzf_layout 'reverse'
set -g @extrakto_split_direction 'p'
set -g automatic-rename off
set -g status-interval 5

# ─── PowerKit ────────────────────────────────────────────────────────────────
set -g @powerkit_theme "tokyo-night"
set -g @powerkit_theme_variant "night"
set -g @powerkit_transparent "true"
set -g @powerkit_separator_style "rounded"
set -g @powerkit_edge_separator_style "rounded:all"
set -g @powerkit_elements_spacing "plugins"
set -g @powerkit_bar_layout "single"
set -g @powerkit_status_order "session,windows,plugins"
set -g @powerkit_plugins "group(cpu,gpu,memory,temperature),packages,datetime"
set -g @powerkit_status_interval "5"
set -g @powerkit_plugin_datetime_format "%I:%M %p"
set -g @powerkit_plugin_gpu_metric "usage,memory"
set -g @powerkit_session_icon "󰣇"
set -g @powerkit_plugin_packages_backend "paru"

# ─── Status bar ──────────────────────────────────────────────────────────────
set -g status-position top

# ─── TPM (keep at very bottom) ─────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'jabirali/tmux-tilish'

run '~/.tmux/plugins/tpm/tpm'

# ─── Agent Deck (scroll + drag-to-copy) ──────────────────────────────────────
# agent-deck-tmux-config-version: 2
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

